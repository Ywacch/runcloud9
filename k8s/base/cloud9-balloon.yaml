apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cloud9-balloon
value: -10
preemptionPolicy: Never
globalDefault: false
description: Reserved capacity placeholder; session pods preempt this class.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cloud9-session
value: 0
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Workloads provisioned for a student lab session namespace.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud9-balloon
  namespace: cloud9-system
  labels:
    app: cloud9-balloon
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cloud9-balloon
  template:
    metadata:
      labels:
        app: cloud9-balloon
    spec:
      priorityClassName: cloud9-balloon
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1425m
              memory: 1440Mi
            limits:
              cpu: 1425m
              memory: 1440Mi