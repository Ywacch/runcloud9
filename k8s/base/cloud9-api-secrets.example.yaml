apiVersion: v1
kind: Secret
metadata:
  name: cloud9-api-secrets
  namespace: cloud9-system
type: Opaque
stringData:
  # Required
  supabase-url: "https://your-project-ref.supabase.co"
  supabase-service-key: "replace-with-service-role-key"

  # Required by current production auth mode
  supabase-jwt-secret: "replace-with-jwt-secret"

  # Comma-separated origins for browser clients
  allowed-origins: "http://localhost:3000"

  # Optional
  sentry-dsn: ""

