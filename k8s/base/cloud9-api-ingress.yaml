apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud9-api-ingress
  namespace: cloud9-system
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud9-api
                port:
                  number: 80
