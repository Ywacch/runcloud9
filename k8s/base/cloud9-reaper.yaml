apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud9-reaper
  namespace: cloud9-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud9-reaper
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud9-reaper
subjects:
  - kind: ServiceAccount
    name: cloud9-reaper
    namespace: cloud9-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud9-reaper
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloud9-reaper
  namespace: cloud9-system
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cloud9-reaper
          restartPolicy: OnFailure
          containers:
            - name: reaper
              image: ghcr.io/your-org/cloud9-api:latest
              imagePullPolicy: Always
              command: ["/cloud9-reaper"]
              args: ["-grace", "5m"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"