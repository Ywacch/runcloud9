apiVersion: v1
kind: Namespace
metadata:
  name: cloud9-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud9-api
  namespace: cloud9-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud9-api-deployer
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "services/proxy", "configmaps", "secrets", "pods", "persistentvolumeclaims", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud9-api-deployer
subjects:
  - kind: ServiceAccount
    name: cloud9-api
    namespace: cloud9-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud9-api-deployer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud9-api
  namespace: cloud9-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud9-api
  template:
    metadata:
      labels:
        app: cloud9-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        # Path defaults to /metrics in kube-prometheus additionalScrapeConfigs (prometheus-values.yaml).
    spec:
      serviceAccountName: cloud9-api
      containers:
        - name: cloud9-api
          image: ghcr.io/your-org/cloud9-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              # 100Mi was too small: kubelet evicted cloud9-api with "ephemeral local storage
              # exceeds the total limit of containers 100Mi" during load spikes (LB 502 HTML).
              ephemeral-storage: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: ENV
              value: "production"
            - name: DEPLOYER
              value: "k8s"
            - name: CLUSTERSTATE
              value: "1"
            - name: CLUSTERSTATE_READINESS
              value: "1"
            - name: CLUSTERSTATE_METRICS
              value: "1"
            - name: CLUSTERSTATE_LB
              value: "1"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloud9-api-secrets
                  key: supabase-url
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud9-api-secrets
                  key: supabase-service-key
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud9-api-secrets
                  key: supabase-jwt-secret
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: cloud9-api-secrets
                  key: allowed-origins
            - name: SEED_BUCKET_NAME
              value: "CHANGE_ME_SEED_BUCKET"
            - name: DDC_BUCKET
              value: "CHANGE_ME_DDC_BUCKET"
            - name: MAX_ACTIVE_DEPLOYMENTS_PER_USER
              value: "1"
            - name: PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
            - name: INFERENCE_URL
              value: "http://runcloud9-ai:5000"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: cloud9-api-secrets
                  key: sentry-dsn
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: cloud9-api
  namespace: cloud9-system
spec:
  selector:
    app: cloud9-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
