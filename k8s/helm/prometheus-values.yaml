# kubernetes-pods keep regex must match signals.PrometheusKeepRegex (TestPrometheusValues_MatchesKeepList).
#
# UNDERSTAND: scrapeInterval controls how often Prometheus polls each pod's /metrics endpoint.
# Default is 15s — too slow for a 10-minute session demo.
# 5s gives dashboard updates that feel live without hammering pods.
#
# Resource caps below target GKE Autopilot trial clusters: unspecified sidecars get
# 500m/2Gi defaults and block scheduling. kube-state-metrics stays enabled — Cloud9
# queries kube_pod_container_resource_* for USE panels and Autopilot fallbacks.

defaultRules:
  create: false

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

prometheus:
  prometheusSpec:
    scrapeInterval: "5s"
    evaluationInterval: "5s"
    retention: 2h
    additionalArgs:
      - name: storage.tsdb.min-block-duration
        value: 30m
      - name: storage.tsdb.max-block-duration
        value: 30m
    storageSpec:
      emptyDir: {}
    # UNDERSTAND: podMonitorSelectorNilUsesHelmValues=false + empty selector means
    # Prometheus watches ALL namespaces for pods with scrape annotations.
    # This is how ephemeral deployment namespaces get auto-discovered.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(?:.*_worker_errors_total|.*_worker_processed_total|.*_worker_processing_duration_seconds_bucket|c9_timeline_dead_tuples|c9_timeline_relation_bytes|cache_errors_total|cache_hits_total|cache_misses_total|cloud9_.*|consistency_read_stale_total|container_cpu_usage_seconds_total|container_memory_working_set_bytes|db_query_duration_seconds_bucket|db_query_duration_seconds_count|db_query_duration_seconds_sum|db_read_total|http_request_duration_seconds_bucket|http_requests_total|memcached_commands_total|memcached_connections_listener_disabled_total|memcached_current_connections|memcached_items_evicted_total|memcached_items_reclaimed_total|monotonic_violations_total|pg_stat_database_xact_commit|pg_stat_database_xact_rollback|pg_stat_user_tables_idx_tup_fetch|pg_stat_user_tables_n_tup_del|pg_stat_user_tables_n_tup_ins|pg_stat_user_tables_n_tup_upd|pg_stat_user_tables_seq_tup_read|process_cpu_seconds_total|process_resident_memory_bytes|rabbitmq_global_messages_delivered_consume_auto_ack_total|rabbitmq_global_messages_received_total|rabbitmq_process_resident_memory_bytes|rabbitmq_queue_messages|rabbitmq_queue_messages_ready|rabbitmq_queue_messages_unacked|rabbitmq_resident_memory_limit_bytes|redis_commands_latencies_usec_bucket|redis_commands_total|redis_cpu_sys_seconds_total|redis_cpu_user_seconds_total|redis_evicted_keys_total|redis_expired_keys_total|redis_memory_max_bytes|redis_memory_used_bytes|redis_rejected_connections_total|replica_stale_reads_total|replication_replay_lag_replay_lag_bytes|replication_replay_lag_replay_lag_seconds|ryw_leader_redirects_total|ryw_violations_total|social_thread_orphan_reads_total|social_thread_reads_total|timeline_append_duration_seconds_bucket|timeline_append_total|timeline_op_errors_total|timeline_range_duration_seconds_bucket|up|wal_lsn_bytes|wal_replay_lsn_bytes)$'
            action: keep
          - source_labels: [__name__]
            regex: .+
            action: drop
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
    containers:
      - name: config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    initContainers:
      - name: init-config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

# UNDERSTAND: we use annotation-based scraping (not PodMonitor CRDs) because
# deployment namespaces are created dynamically. Adding a PodMonitor per namespace
# would require the deployer to create an extra K8s resource per deployment.
# Annotations on the pod spec are simpler — Prometheus discovers them automatically.
#
# Required annotations on pods to enable scraping:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "<container_port>"
#   prometheus.io/path: "/metrics"  (default, can omit)

grafana:
  enabled: false # UI unused — ganymede queries Prometheus directly (PROMETHEUS_URL)

# Reduce resource usage — Autopilot has minimum floors so keep these reasonable
alertmanager:
  enabled: false # not needed for demo

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

nodeExporter:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
