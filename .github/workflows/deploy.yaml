name: Deploy API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ganymede-cloud
      CLUSTER_NAME: cloud9
      CLUSTER_REGION: us-central1
      GAR_HOST: us-central1-docker.pkg.dev
      GAR_REPO: cloud9-images
      IMAGE_NAME: cloud9-api
      NAMESPACE: cloud9-system
      DEPLOYMENT_NAME: cloud9-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GAR_HOST --quiet

      - name: Build and push image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "$CLUSTER_NAME" --region "$CLUSTER_REGION" --project "$PROJECT_ID"

      - name: Deploy to GKE
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$IMAGE_NAME"="$IMAGE:$SHA" \
            -n "$NAMESPACE"
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=180s
