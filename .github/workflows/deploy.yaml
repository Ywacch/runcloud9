name: Deploy API

on:
  push:
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PROJECT_ID: runcloud9-514803
      CLUSTER_NAME: cloud9
      CLUSTER_LOCATION: us-central1-a
      GAR_HOST: us-central1-docker.pkg.dev
      GAR_REPO: cloud9-images
      IMAGE_NAME: cloud9-api
      NAMESPACE: cloud9-system
      DEPLOYMENT_NAME: cloud9-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GAR_HOST --quiet

      - name: Select template images
        id: templates
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mapfile -t names < <(bash scripts/ci/changed-template-images.sh "$BEFORE" HEAD)
          echo "images=${names[*]}" >> "$GITHUB_OUTPUT"
          echo "count=${#names[@]}" >> "$GITHUB_OUTPUT"
          if [[ ${#names[@]} -eq 0 ]]; then
            echo "No template images to rebuild."
          else
            echo "Rebuild: ${names[*]}"
          fi

      - name: Build and push changed template images
        if: steps.templates.outputs.count != '0'
        run: |
          short="git-$(git rev-parse --short=7 HEAD)"
          registry="$GAR_HOST/$PROJECT_ID/$GAR_REPO"
          for img in ${{ steps.templates.outputs.images }}; do
            ref="$registry/$img:$short"
            echo "=== $img => $short ==="
            docker build -f "images/$img/Dockerfile" -t "$ref" .
            docker push "$ref"
          done
          python3 scripts/ci/bump-image-versions.py config/image-versions.json "$short" ${{ steps.templates.outputs.images }}

      - name: Verify template image tags exist
        env:
          TEMPLATE_IMAGE_REGISTRY: us-central1-docker.pkg.dev/runcloud9-514803/cloud9-images
        run: bash scripts/ci/verify-image-tags.sh config/image-versions.json

      - name: Build and push API image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          docker build --build-arg "VERSION=$SHA" -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          CID="$(docker create "$IMAGE:$SHA")"
          docker cp "$CID:/config/image-versions.json" /tmp/image-versions.json
          docker rm "$CID"
          python3 -c 'import json,sys; a=json.load(open("config/image-versions.json")); b=json.load(open("/tmp/image-versions.json"));
          if a != b: sys.exit("baked image-versions.json does not match the workspace")'
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "$CLUSTER_NAME" --zone "$CLUSTER_LOCATION" --project "$PROJECT_ID"

      # PriorityClasses and the pause Deployment are not part of the API
      # image rollout. Session pods reference cloud9-session; apply before
      # the new API creates workloads. Manifest replicas stay at 0.
      - name: Apply balloon and session priority manifest
        run: kubectl apply -f k8s/base/cloud9-balloon.yaml

      - name: Deploy to GKE
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          # The API takes a coordination Lease before it listens. A rolling
          # update deadlocks: the new pod cannot become Ready while the old
          # pod still holds the lease. Recreate deletes the old pod first.
          # The lease Role lives in k8s/base/cloud9-api.yaml. Apply it once
          # from an account that can patch Roles. This job cannot.
          kubectl patch deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" --type=json \
            -p='[{"op":"add","path":"/spec/strategy","value":{"type":"Recreate"}}]'
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$IMAGE_NAME"="$IMAGE:$SHA" \
            -n "$NAMESPACE"
          # Same image as the API. The reaper binary is /cloud9-reaper in that
          # image. :latest with IfNotPresent keeps a node cache that predates
          # the binary, so the CronJob must track this immutable tag.
          if kubectl get cronjob cloud9-reaper -n "$NAMESPACE" >/dev/null 2>&1; then
            kubectl set image cronjob/cloud9-reaper \
              reaper="$IMAGE:$SHA" \
              -n "$NAMESPACE"
          fi
          # Drop the emergency skip only after the new image is in the pod
          # template. Unsetting it first restarts the current image, whose tag
          # check treats an existing OCI index as a missing tag.
          kubectl set env deployment/"$DEPLOYMENT_NAME" VERIFY_TEMPLATE_IMAGES- -n "$NAMESPACE"
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=300s

      - name: Open PR for template image tags
        if: steps.templates.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: chore: bump template image tags
          title: chore: bump template image tags
          body: |
            Updates `config/image-versions.json` after the deploy workflow rebuilt template images.
          branch: chore/deploy-image-tags-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            config/image-versions.json
