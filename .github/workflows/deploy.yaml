name: Deploy API

on:
  push:
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PROJECT_ID: runcloud9-505411
      CLUSTER_NAME: cloud9
      CLUSTER_REGION: us-central1
      GAR_HOST: us-central1-docker.pkg.dev
      GAR_REPO: cloud9-images
      IMAGE_NAME: cloud9-api
      NAMESPACE: cloud9-system
      DEPLOYMENT_NAME: cloud9-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GAR_HOST --quiet

      - name: Select template images
        id: templates
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mapfile -t names < <(bash scripts/ci/changed-template-images.sh "$BEFORE" HEAD)
          echo "images=${names[*]}" >> "$GITHUB_OUTPUT"
          echo "count=${#names[@]}" >> "$GITHUB_OUTPUT"
          if [[ ${#names[@]} -eq 0 ]]; then
            echo "No template images to rebuild."
          else
            echo "Rebuild: ${names[*]}"
          fi

      - name: Build and push changed template images
        if: steps.templates.outputs.count != '0'
        run: |
          short="git-$(git rev-parse --short=7 HEAD)"
          registry="$GAR_HOST/$PROJECT_ID/$GAR_REPO"
          for img in ${{ steps.templates.outputs.images }}; do
            ref="$registry/$img:$short"
            echo "=== $img => $short ==="
            docker build -f "images/$img/Dockerfile" -t "$ref" .
            docker push "$ref"
          done
          python3 scripts/ci/bump-image-versions.py config/image-versions.json "$short" ${{ steps.templates.outputs.images }}

      - name: Build and push API image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          docker build --build-arg "VERSION=$SHA" -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          CID="$(docker create "$IMAGE:$SHA")"
          docker cp "$CID:/config/image-versions.json" /tmp/image-versions.json
          docker rm "$CID"
          python3 -c 'import json,sys; a=json.load(open("config/image-versions.json")); b=json.load(open("/tmp/image-versions.json"));
          if a != b: sys.exit("baked image-versions.json does not match the workspace")'
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "$CLUSTER_NAME" --region "$CLUSTER_REGION" --project "$PROJECT_ID"

      - name: Deploy to GKE
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          # The API takes a coordination Lease before it listens. A rolling
          # update deadlocks: the new pod cannot become Ready while the old
          # pod still holds the lease. Recreate deletes the old pod first.
          # The lease Role lives in k8s/base/cloud9-api.yaml. Apply it once
          # from an account that can patch Roles. This job cannot.
          kubectl patch deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" --type=json \
            -p='[{"op":"add","path":"/spec/strategy","value":{"type":"Recreate"}}]'
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$IMAGE_NAME"="$IMAGE:$SHA" \
            -n "$NAMESPACE"
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=300s

      - name: Commit template image tags
        if: steps.templates.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/image-versions.json
          if git diff --cached --quiet; then
            echo "image-versions.json already matches this commit"
            exit 0
          fi
          git commit -m "chore: bump template image tags [skip ci]"
          git push origin HEAD:main
