- job: main_db
  engine: postgresql
  fit: natural
  build: available
  reason: Primary relational store for lab templates.
  fidelity: real
  introspect: tables
  chaos:
    - pod_kill
    - stall_replica
    - split_primary_replica
    - split_app_store
    - promote_replica
    - promote_lagging_replica
    - kill_replica
  signals: []
- job: hot_cache
  engine: redis
  fit: natural
  build: available
  reason: In-memory key cache with TTL.
  fidelity: real
  introspect: keys
  chaos:
    - pod_kill
    - cache_flush
    - split_app_store
  signals:
    - field: cacheHits
      concept: cache_efficiency
      availability: measured
    - field: cacheMisses
      concept: cache_efficiency
      availability: measured
    - field: evictionsPerSec
      concept: eviction
      availability: measured
    - field: p99Latency
      concept: server_latency
      availability: measured
    - field: avgLatency
      concept: server_latency
      availability: measured
    - field: redisRejectedRate
      concept: flow_control
      availability: measured
- job: hot_cache
  engine: memcached
  fit: natural
  build: available
  reason: In-memory key cache with TTL; compare lost-update behavior on timelines.
  fidelity: real
  coHost: false
  introspect: keys
  chaos:
    - pod_kill
    - cache_flush
    - split_app_store
  signals:
    - field: cacheHits
      concept: cache_efficiency
      availability: measured
    - field: cacheMisses
      concept: cache_efficiency
      availability: measured
    - field: p99Latency
      concept: server_latency
      availability: measured
    - field: avgLatency
      concept: server_latency
      availability: measured
    - field: redisCmdRates
      availability: not_applicable
      reason: Memcached has no per-command Redis series.
