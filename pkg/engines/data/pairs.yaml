- job: work_queue
  engine: rabbitmq
  fit: natural
  build: available
  reason: AMQP queues with ack semantics.
  fidelity: real
  coHost: false
  introspect: queues
  chaos:
    - pod_kill
    - pause_consumers
  signals:
    - field: queueDepth
      concept: consumer_lag
      availability: measured
    - field: messagesReady
      concept: consumer_lag
      availability: measured
    - field: messagesUnacked
      concept: redelivery
      availability: measured
    - field: produceRate
      concept: flow_control
      availability: measured
    - field: consumeRate
      concept: flow_control
      availability: measured
    - field: mqSaturationRatio
      concept: flow_control
      availability: measured
    - field: mqMemoryUsed
      concept: memory_overhead
      availability: measured
    - field: mqMemoryLimit
      concept: memory_overhead
      availability: measured
- job: work_queue
  engine: redis
  fit: workable
  build: available
  reason: Lists and streams can queue work with different failure modes.
  fidelity: real
  ttlSeparatesEviction: true
  introspect: stream_peek
  chaos:
    - pod_kill
    - pause_consumers
  signals:
    - field: queueDepth
      availability: not_built
      reason: Redis Streams queue metrics land in E-23c. Backlog is consumer-group lag, not XLEN.
    - field: messagesReady
      availability: not_built
      reason: Redis Streams queue metrics land in E-23c. Backlog is consumer-group lag, not XLEN.
    - field: messagesUnacked
      availability: not_built
      reason: Redis Streams queue metrics land in E-23c. Backlog is consumer-group lag, not XLEN.
    - field: produceRate
      availability: not_built
      reason: Redis Streams queue metrics land in E-23c. Backlog is consumer-group lag, not XLEN.
    - field: consumeRate
      availability: not_built
      reason: Redis Streams queue metrics land in E-23c. Backlog is consumer-group lag, not XLEN.
    - field: mqSaturationRatio
      availability: not_built
      reason: Redis Streams queue metrics land in E-23c. Backlog is consumer-group lag, not XLEN.
    - field: mqMemoryUsed
      availability: not_applicable
      reason: Redis memory belongs to the node. See node memory.
    - field: mqMemoryLimit
      availability: not_applicable
      reason: Redis memory belongs to the node. See node memory.