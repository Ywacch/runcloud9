id: social-feed
name: "Social Feed (Push)"
description: >-
  Fan-out on write: new posts are pushed to every follower's pre-computed feed
  via a message queue and worker. Reads are O(1) but writes create amplification.
  Demonstrates consumer lag, backpressure, and queue depth under load.
components: 5
bottleneck: "Consumer lag under high fan-out"
descriptionLite: >-
  Fan-out on write without a queue: the app pushes new posts into follower timelines
  in Redis. Reads are O(1) from sorted sets; POST pays sync fan-out cost on the app server.
componentsLite: 3
bottleneckLite: "Sync fan-out on POST scales with follower count"
available: true
premium: false
tags: [async, fan-out, advanced]
simulatable: true
deployable: true
imageKey: social-feed
workerImageKey: fanout-worker
appDatabaseMode: always
workerTimelineStore: redis
prometheusMetrics:
  # Metric key convention (neutral, OSS-facing):
  #   <group>.<op>_rate   — throughput (req/s)
  #   <group>.<op>_p50|p95|p99 — latency quantiles (seconds from PromQL)
  queries:
    - key: posts.total_sync
      expr: sum(social_post_total{<<ns>>,mode="sync"})
    - key: posts.total_async
      expr: sum(social_post_total{<<ns>>,mode="async"})
    - key: feed.pull_rate
      expr: sum(rate(social_feed_request_total{<<ns>>,mode="pull"}[30s]))
    - key: feed.push_rate
      expr: sum(rate(social_feed_request_total{<<ns>>,mode=~"push.*"}[30s]))
    - key: feed.push_total
      expr: sum(social_feed_request_total{<<ns>>,mode=~"push.*"})
    - key: feed.pull_p50
      expr: histogram_quantile(0.50, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode="pull"}[30s])) by (le))
    - key: feed.pull_p95
      expr: histogram_quantile(0.95, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode="pull"}[30s])) by (le))
    - key: feed.pull_p99
      expr: histogram_quantile(0.99, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode="pull"}[30s])) by (le))
    - key: feed.push_p50
      expr: histogram_quantile(0.50, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode=~"push.*"}[30s])) by (le))
    - key: feed.push_p95
      expr: histogram_quantile(0.95, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode=~"push.*"}[30s])) by (le))
    - key: feed.push_p99
      expr: histogram_quantile(0.99, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode=~"push.*"}[30s])) by (le))
    - key: worker.processed
      expr: sum(social_worker_processed_total{<<ns>>})
    - key: worker.errors
      expr: sum(social_worker_errors_total{<<ns>>})
    - key: worker.errors.redis
      expr: sum(rate(social_worker_errors_total{<<ns>>,reason=~"redis.*"}[30s]))
    - key: worker.writes.redis
      expr: sum(social_worker_writes_total{<<ns>>,store="redis"})
    - key: worker.redis_write_rate
      expr: sum(rate(social_worker_writes_total{<<ns>>,store="redis"}[30s]))
    - key: worker.consume_rate
      expr: sum(rate(social_worker_processed_total{<<ns>>}[30s]))
    - key: worker.fanout_size_avg
      expr: sum(rate(social_worker_fanout_size_sum{<<ns>>}[30s])) / sum(rate(social_worker_fanout_size_count{<<ns>>}[30s]))
    - key: worker.fanout_size_p99
      expr: histogram_quantile(0.99, sum(rate(social_worker_fanout_size_bucket{<<ns>>}[30s])) by (le))
    - key: worker.latency_p99
      expr: histogram_quantile(0.99, sum(rate(social_worker_processing_duration_seconds_bucket{<<ns>>}[30s])) by (le))
    - key: mq.publish_total
      expr: sum(social_mq_publish_total{<<ns>>})
    - key: mq.produce_rate
      expr: sum(rate(social_mq_publish_total{<<ns>>}[30s]))
    - key: mq.publish_errors
      expr: sum(social_mq_publish_errors_total{<<ns>>})
  augments:
    - key: mq.queue_depth
      component: mq
      path: queueDepth
    - key: mq.consume_rate
      component: mq
      path: consumeRate
    - key: mq.saturation_ratio
      component: mq
      path: mqSaturationRatio
    - key: worker.backlog
      component: mq
      path: queueDepth
    - key: mq.produce_rate
      component: mq
      path: produceRate
      onlyIfPositive: true
    - key: worker.consume_rate
      component: worker
      path: requestRate
      onlyIfPositive: true
    - key: redis.ops_per_sec
      component: cache
      path: redisOpsPerSec
    - key: redis.connected_clients
      component: cache
      path: activeConnections
    - key: redis.rejected_connections_rate
      component: cache
      path: redisRejectedRate
    - key: redis.avg_latency
      component: cache
      path: avgLatency
seed:
  dbType: postgres
  dumpPath: social-feed/social-feed.dump
  container: postgres
  podLabel: app=postgres
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: message_queue
    position: [4, -1]
  - type: worker
    position: [6, -1]
  - type: cache
    position: [4, 1]
  - type: database
    position: [6, 1]
preset:
  nodes:
    - id: app-1
      type: compute
      position: [-1, 0.3, 0]
      label: App server
      config:
        replicas: 1
        instanceSize: small
    - id: mq-1
      type: message_queue
      position: [2, 0.3, -1.4]
      label: Message Queue
      config:
        engine: rabbitmq
        durable: true
    - id: worker-1
      type: worker
      position: [5, 0.3, -1.4]
      label: Fan-out Worker
      config:
        replicas: 1
        instanceSize: small
        workerPrefetch: 10
        workerConcurrency: 1
    - id: cache-1
      type: cache
      position: [2, 0.3, 1.4]
      label: Redis
      config:
        strategy: timeline-store
        cacheStrategy: timeline-store
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [5, 0.3, 1.4]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-app-mq
      sourceId: app-1
      targetId: mq-1
      protocol: http
    - id: e-worker-mq
      sourceId: worker-1
      targetId: mq-1
      protocol: tcp
    - id: e-worker-db
      sourceId: worker-1
      targetId: db-1
      protocol: tcp
    - id: e-worker-cache
      sourceId: worker-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
presetLite:
  nodes:
    - id: app-1
      type: compute
      position: [-1, 0.3, 0]
      label: App server
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [2, 0.3, 1.4]
      label: Redis
      config:
        strategy: timeline-store
        cacheStrategy: timeline-store
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [5, 0.3, 1.4]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp

# Storytelling targets timeline-store on Redis (fan-out / sorted sets), not caching-proxy strategy matrix.
introspection:
  db:
    engine: postgres
    tables: [users, posts, follows]
  cache:
    engine: redis
    keyPatterns: ["timeline:*"]
  mq:
    engine: rabbitmq
    queues: [fanout]

storytelling:
  roles:
    cache:
      base: "Pre-computed user timeline cache (Redis sorted sets)"
      variants:
        - when: { topology: "hasMQ+hasWorker" }
          label: "Written by the fan-out worker after consuming from the queue"
        - when: { topology: "!hasMQ" }
          label: "Written synchronously by app-server on each post"
    mq:
      base: "Buffers new posts before fan-out to followers"
    worker:
      base: "Consumes posts from the queue, writes to follower timelines"
      variants:
        - when: { topology: "!hasCache" }
          label: "No Redis target for fan-out writes"
    db:
      base: "Stores users, posts, and the follower graph"
    app-server:
      base: "Handles post creation and feed reads"
      variants:
        - when: { topology: "!hasCache+!hasMQ" }
          label: "Pull mode: every feed read runs a DB JOIN"
        - when: { topology: "hasCache+!hasMQ" }
          label: "Fans out new posts in-process; serves feeds from Redis"
        - when: { topology: "hasMQ" }
          label: "Publishes new posts to the queue; serves feeds from Redis"
    lb:
      base: "Routes requests across app-server replicas"
  edges:
    lb->app-server:
      base: "Load balancer spreads HTTP to app-server replicas."
    app-server->db:
      base: "App reads and writes users, posts, and the follower graph in Postgres."
    app-server->cache:
      base: "App reads follower timelines from Redis (ZREVRANGE on timeline:{userId})."
      variants:
        - when: { topology: "!hasCache" }
          label: "No Redis on the canvas — feed reads fall back to Postgres JOINs."
    app-server->mq:
      base: "App publishes new posts to the queue for async fan-out."
    worker->mq:
      base: "Fan-out worker consumes post events from this queue."
    worker->db:
      base: "Worker loads follower lists and post metadata from Postgres."
    worker->cache:
      base: "Worker writes timeline:{followerId} sorted sets in Redis after each post."
  journeys:
    - id: feed-read
      method: GET
      path: "/feed/{userId}"
      label: "Feed reads"
      trafficPercent: 60
      steps:
        - component: lb
          action: "Routes to app-server."
          requires: [lb]
        - component: app-server
          action: "Check Redis for materialized timeline."
          metricsKey: p99Latency
          requires: [cache]
        - component: cache
          action: "ZREVRANGE timeline:{userId} 0 19"
          detail: "Redis sorted set lookup, sub-ms when warm."
          metricsKey: redisAvgLatency
          requires: [cache]
          lesson: >-
            Push read path: twenty newest posts from a pre-built timeline. Score is post time;
            no JOIN when the zset is warm.
        - component: db
          action: "3-table JOIN: posts × follows × users."
          detail: "SELECT ... WHERE follower_id = ? ORDER BY created_at DESC"
          condition: "If Redis empty or no cache"
          requires: [db]
          lesson: >-
            Optional miss path when the timeline key is empty. Strict push mode usually
            returns an empty feed instead of falling back here.
        - component: app-server
          action: "3-table JOIN: posts, follows, users. Returns top 20 by timestamp."
          detail: "SELECT p.* FROM posts p JOIN follows f ON f.followed_id = p.user_id WHERE f.follower_id = $1 ORDER BY p.created_at DESC LIMIT 20"
          onlyWhen: { topology: "!hasCache" }
          lesson: >-
            Pull mode: every GET runs this JOIN. Latency tracks how many accounts you follow,
            not how many posts landed in Redis ahead of time.
      explanation: >-
        In push mode, most warm reads hit Redis. Without cache, every read does a 3-table JOIN.
      explanationVariants:
        - when: { topology: "!hasCache" }
          text: >-
            Pull mode: every feed request runs a 3-table JOIN across posts, follows, and users.
            Latency grows with follower count since there's no pre-computed timeline to read from.
        - when: { topology: "hasCache+!hasMQ" }
          text: >-
            Sync push (no queue): timelines live in Redis like async push, but the app-server
            loads followers and ZADDs on each post instead of a worker. Reads stay cheap;
            POST still pays for follower lookup on the app.
    - id: post-create
      method: POST
      path: "/post"
      label: "Create post"
      trafficPercent: 30
      steps:
        - component: lb
          action: "Routes to app-server."
          requires: [lb]
        - component: app-server
          action: "INSERT post into Postgres."
          metricsKey: p99Latency
        - component: mq
          action: "Publish post to fanout exchange."
          detail: "Async — response returns here."
          requires: [mq]
          lesson: >-
            The client gets 202 after Postgres and a successful publish. Timeline writes
            happen later on workers, not on this HTTP thread.
        - component: worker
          action: "Consume from queue, fetch followers from DB."
          requires: [mq, worker]
          lesson: >-
            Each message triggers a follower query and a batch of ZADDs. Queue depth
            and worker count decide how fast timelines catch up.
        - component: cache
          action: "ZADD to timeline:{followerId} for each follower."
          detail: "Batched pipeline fan-out."
          requires: [worker, cache]
          lesson: >-
            One post becomes N sorted-set updates. That write amplification is the cost
            of O(1) feed reads later.
        - component: cache
          action: "App-server does sync ZADD to follower timelines."
          detail: "Fire-and-forget goroutine, does not block response."
          requires: [cache]
          excludeWhen: { topology: "hasMQ" }
          onlyWhen: { topology: "!hasMQ+hasCache" }
          lesson: >-
            Sync push: the app loads followers before it responds, then ZADD runs in a
            goroutine. Reads still hit Redis; POST latency still scales with follower count.
      explanation: >-
        With RabbitMQ, the app inserts the post, publishes one message, and returns
        202 once the broker accepts it. A worker loads followers from Postgres and
        ZADDs each timeline. Your client never waits on Redis.
      explanationVariants:
        - when: { topology: "hasCache+!hasMQ" }
          text: >-
            Sync push (no queue): the app inserts the post, loads followers from Postgres,
            and ZADDs each timeline in a goroutine before returning 200. Reads stay cheap
            in Redis; POST latency still scales with follower count.
  narrativeContext:
    cache_hit_low:
      cause: >-
        Sorted-set timelines are not classic cache-aside GET/SET; a low hit share can mean cold timelines, eviction under memory pressure, or traffic patterns that rarely reuse keys.
      suggestion: >-
        Add Redis memory or shard timelines across more capacity so follower timelines stay resident under fan-out load.
    mq_backpressure:
      cause: >-
        Each post fans out to ~{worker.fanout_size_p99} followers.
        At {mq.produce_rate} posts/s, workers deliver ~{worker.redis_write_rate} Redis writes/s.
      suggestion: "Add more worker replicas to increase fan-out throughput."
    cascade_cache_db:
      cause: >-
        When timeline freshness or eviction shifts what is resident in Redis, read paths can lean harder on Postgres even though the data model is push-oriented.
      suggestion: >-
        Add Redis memory or cache capacity if timelines are being evicted, or add read replicas if Postgres is the sustained bottleneck.
    cascade_latency_miss:
      cause: >-
        For a Redis timeline store, rising latency with more misses often means timelines are cold or incomplete, so read paths do more work than a hot sorted-set lookup; when timelines are not materialized you also pay the full 3-table JOIN cost.
      suggestion: >-
        Keep workers fed through MQ so timelines stay warm; add Redis memory or replicas if eviction is trimming hot keys.
    cascade_mq_backpressure:
      suggestion: >-
        Add worker replicas and ensure the cache tier exists for the timeline store workers write into.
    db_latency:
      cause: >-
        Feed reads that miss Redis do a 3-table JOIN (posts × follows × users), which is expensive as data grows.
      suggestion: >-
        Add MQ + worker nodes so timelines are precomputed into Redis; reads stay on sorted-set timelines instead of large joins.