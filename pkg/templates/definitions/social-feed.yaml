id: social-feed
name: "Social Feed (Push)"
description: >-
  Fan-out on write: new posts are pushed to every follower's pre-computed feed
  via a message queue and worker. Reads are O(1) but writes create amplification.
  Demonstrates consumer lag, backpressure, and queue depth under load.
components: 6
bottleneck: "Consumer lag under high fan-out"
available: true
premium: false
tags: [async, fan-out, advanced]
simulatable: true
deployable: true
imageKey: social-feed
workerImageKey: fanout-worker
appDatabaseMode: always
seed:
  dbType: postgres
  dumpPath: social-feed/social-feed.dump
  container: postgres
  podLabel: app=postgres
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: message_queue
    position: [4, -1]
  - type: worker
    position: [6, -1]
  - type: cache
    position: [4, 1]
  - type: database
    position: [6, 1]
preset:
  nodes:
    - id: lb-1
      type: load_balancer
      position: [-4, 0.3, 0]
      label: Load Balancer
      config:
        algorithm: round-robin
    - id: app-1
      type: compute
      position: [-1, 0.3, 0]
      label: App server
      config:
        replicas: 1
        instanceSize: small
    - id: mq-1
      type: message_queue
      position: [2, 0.3, -1.4]
      label: Message Queue
      config:
        engine: rabbitmq
        durable: true
    - id: worker-1
      type: worker
      position: [5, 0.3, -1.4]
      label: Fan-out Worker
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [2, 0.3, 1.4]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [5, 0.3, 1.4]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-lb-app
      sourceId: lb-1
      targetId: app-1
      protocol: http
    - id: e-app-mq
      sourceId: app-1
      targetId: mq-1
      protocol: http
    - id: e-worker-mq
      sourceId: worker-1
      targetId: mq-1
      protocol: tcp
    - id: e-worker-db
      sourceId: worker-1
      targetId: db-1
      protocol: tcp
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
