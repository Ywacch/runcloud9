id: social-feed-pull
name: "Social Feed (Pull)"
description: >-
  Fan-out on read: feeds are generated on demand by joining posts and follows.
  Simple architecture but reads get expensive as follower counts grow.
  Compare with Push variant to see the tradeoff.
components: 4
bottleneck: "JOIN query latency scaling with follower count"
available: true
premium: false
tags: [read-heavy, beginner]
simulatable: true
deployable: true
imageKey: social-feed
seed:
  dbType: postgres
  dumpPath: social-feed/social-feed.dump
  container: postgres
  podLabel: app=postgres
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: cache
    position: [4, 0]
  - type: database
    position: [6, 0]
preset:
  nodes:
    - id: lb-1
      type: load_balancer
      position: [-3, 0.3, 0]
      label: Load Balancer
      config:
        algorithm: round-robin
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: Feed Service
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [3, 0.3, -1.2]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [3, 0.3, 1.2]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-lb-app
      sourceId: lb-1
      targetId: app-1
      protocol: http
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
