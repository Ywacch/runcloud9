id: social-feed-pull
name: "Social Feed (Pull)"
description: >-
  Fan-out on read: feeds are generated on demand by joining posts and follows.
  Simple architecture but reads get expensive as follower counts grow.
  Compare with Push variant to see the tradeoff.
components: 3
bottleneck: "JOIN query latency scaling with follower count"
available: true
premium: false
tags: [read-heavy, beginner]
simulatable: true
deployable: true
# Lower default loadgen rate: most traffic hits expensive fan-out-on-read feed queries at alpha resources.
loadgen:
  defaultRps: 25
  identity: { param: userId }
  # Virtual users: closed-loop scripts (post a root, then reply) beside open-loop RPS.
  vu:
    identity: { poolEndpoint: /user-pool, poolField: userIds }
    actions:
      create_root:
        method: POST
        path: /post
        body: '{"user_id":{{.UserID}},"content":"c9 root {{.Seq}}"}'
        idField: post_id
      create_reply:
        method: POST
        path: /post
        body: '{"user_id":{{.UserID}},"content":"c9 reply","reply_to_id":{{.ParentID}}}'
        idField: post_id
      read_thread:
        method: GET
        path: /threads/{{.RootID}}
  endpoints:
    - method: GET
      pathTemplate: /feed/{userId}
      paramName: userId
      poolEndpoint: /user-pool
      poolField: userIds
      weight: 60
    - method: POST
      pathTemplate: /post
      paramName: userId
      poolEndpoint: /user-pool
      poolField: userIds
      bodyTemplate: '{"user_id":{{.Param}}, "content":"Load test post {{.Rand}}"}'
      weight: 30
    - method: GET
      pathTemplate: /users/{userId}
      paramName: userId
      poolEndpoint: /user-pool
      poolField: userIds
      weight: 10
  params:
    - key: celebrityPostPct
      type: percent
      default: 5
      pools:
        - name: celebrity
          poolEndpoint: /user-pool?segment=celebrity
          poolField: userIds
        - name: normal
          poolEndpoint: /user-pool?segment=normal
          poolField: userIds
      applyTo:
        - POST /post
    - key: readAfterPostBoost
      type: float
      default: 1.0
      min: 1.0
      max: 5.0
  schedules:
    - id: steady
      label: Steady load
      phases:
        - durationSeconds: 0
          rpsMultiplier: 1.0
    - id: world_cup_goal
      label: Celebrity post storm
      phases:
        - durationSeconds: 60
          rpsMultiplier: 1.0
          note: baseline
        - durationSeconds: 30
          rpsMultiplier: 4.0
          endpointBoost:
            POST /post: 8.0
          actorOverride:
            celebrityPostPct: 90
        - durationSeconds: 45
          rpsMultiplier: 2.0
          endpointBoost:
            GET /feed/{userId}: 3.0
          note: feed refresh storm
        - durationSeconds: 0
          rpsMultiplier: 1.0
    - id: cpu_ramp
      label: Step up traffic to scale out
      phases:
        - durationSeconds: 30
          rpsMultiplier: 1
          note: baseline
        - durationSeconds: 45
          rpsMultiplier: 4
        - durationSeconds: 0
          rpsMultiplier: 8
          note: hold
imageKey: social-feed
appDatabaseMode: always
jobs:
  - id: main_db
    required: true
    allowedEngines: [postgresql]
    defaultNodeType: db
  - id: hot_cache
    required: false
    allowedEngines: [redis]
    defaultNodeType: cache
prometheusMetrics:
  # Metric key convention (neutral, OSS-facing):
  #   <group>.<op>_rate   — throughput (req/s)
  #   <group>.<op>_p50|p95|p99 — latency quantiles (seconds from PromQL)
  queries:
    - key: posts.total_sync
      expr: sum(social_post_total{<<ns>>,mode="sync"})
    - key: posts.total_async
      expr: sum(social_post_total{<<ns>>,mode="async"})
    - key: feed.pull_rate
      expr: sum(rate(social_feed_request_total{<<ns>>,mode="pull"}[30s]))
    - key: feed.push_rate
      expr: sum(rate(social_feed_request_total{<<ns>>,mode=~"push.*"}[30s]))
    - key: feed.push_total
      expr: sum(social_feed_request_total{<<ns>>,mode=~"push.*"})
    - key: feed.pull_p50
      expr: histogram_quantile(0.50, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode="pull"}[30s])) by (le))
    - key: feed.pull_p95
      expr: histogram_quantile(0.95, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode="pull"}[30s])) by (le))
    - key: feed.pull_p99
      expr: histogram_quantile(0.99, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode="pull"}[30s])) by (le))
    - key: feed.push_p50
      expr: histogram_quantile(0.50, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode=~"push.*"}[30s])) by (le))
    - key: feed.push_p95
      expr: histogram_quantile(0.95, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode=~"push.*"}[30s])) by (le))
    - key: feed.push_p99
      expr: histogram_quantile(0.99, sum(rate(social_feed_latency_seconds_bucket{<<ns>>,mode=~"push.*"}[30s])) by (le))
    - key: worker.processed
      expr: sum(social_worker_processed_total{<<ns>>})
    - key: worker.errors
      expr: sum(social_worker_errors_total{<<ns>>})
    - key: worker.errors.redis
      expr: sum(rate(social_worker_errors_total{<<ns>>,reason=~"redis.*"}[30s]))
    - key: worker.writes.redis
      expr: sum(social_worker_writes_total{<<ns>>,store="redis"})
    - key: worker.redis_write_rate
      expr: sum(rate(social_worker_writes_total{<<ns>>,store="redis"}[30s]))
    - key: worker.consume_rate
      expr: sum(rate(social_worker_processed_total{<<ns>>}[30s]))
    - key: worker.fanout_size_avg
      expr: sum(rate(social_worker_fanout_size_sum{<<ns>>}[30s])) / sum(rate(social_worker_fanout_size_count{<<ns>>}[30s]))
    - key: worker.fanout_size_p99
      expr: histogram_quantile(0.99, sum(rate(social_worker_fanout_size_bucket{<<ns>>}[30s])) by (le))
    - key: worker.latency_p99
      expr: histogram_quantile(0.99, sum(rate(social_worker_processing_duration_seconds_bucket{<<ns>>}[30s])) by (le))
    - key: mq.publish_total
      expr: sum(social_mq_publish_total{<<ns>>})
    - key: mq.produce_rate
      expr: sum(rate(social_mq_publish_total{<<ns>>}[30s]))
    - key: mq.publish_errors
      expr: sum(social_mq_publish_errors_total{<<ns>>})
  augments:
    - key: mq.queue_depth
      component: mq
      path: queueDepth
    - key: mq.consume_rate
      component: mq
      path: consumeRate
    - key: mq.saturation_ratio
      component: mq
      path: mqSaturationRatio
    - key: worker.backlog
      component: mq
      path: queueDepth
    - key: mq.produce_rate
      component: mq
      path: produceRate
      onlyIfPositive: true
    - key: worker.consume_rate
      component: worker
      path: requestRate
      onlyIfPositive: true
    - key: redis.ops_per_sec
      component: cache
      path: redisOpsPerSec
    - key: redis.connected_clients
      component: cache
      path: activeConnections
    - key: redis.rejected_connections_rate
      component: cache
      path: redisRejectedRate
    - key: redis.avg_latency
      component: cache
      path: avgLatency
seed:
  dbType: postgres
  dumpPath: social-feed/social-feed.dump
  container: postgres
  podLabel: app=postgres
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: database
    position: [4, 0]
preset:
  nodes:
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: Feed Service
      config:
        replicas: 1
        instanceSize: small
    - id: db-1
      type: database
      position: [3, 0.3, 0]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
variations:
  - id: app-db
    label: Pull feed (DB JOINs)
    description: Fan-out on read. Every feed request joins posts, follows, and users in Postgres.
    nodes:
      - id: app-1
        type: compute
        position: [0, 0.3, 0]
        label: Feed Service
        config:
          replicas: 1
          instanceSize: small
      - id: db-1
        type: database
        position: [3, 0.3, 0]
        label: PostgreSQL
        config:
          engine: postgresql
          storageGB: 10
          maxConnections: 100
    edges:
      - id: e-app-db
        sourceId: app-1
        targetId: db-1
        protocol: tcp

introspection:
  db:
    engine: postgres
    tables: [users, posts, follows]

storytelling:
  roles:
    app-server:
      base: "GET /feed/{userId} and POST /post against Postgres only"
      variants:
        - when: { topology: "!hasCache" }
          label: "Pull mode: every feed read is a DB JOIN"
    db:
      base: "Stores users, posts, and the follower graph"
    lb:
      base: "Routes requests across app-server replicas"
  edges:
    lb->app-server:
      base: "Load balancer spreads HTTP to app-server replicas."
    app-server->db:
      base: "Every feed read and post write hits Postgres (pull / JOIN path)."
  journeys:
    - id: feed-read
      method: GET
      path: "/feed/{userId}"
      label: "Feed reads"
      trafficPercent: 60
      steps:
        - component: app-server
          action: "Runs fan-out-on-read query per request."
          detail: >-
            SELECT p.id, p.user_id, u.username, p.content, p.created_at
            FROM posts p
            JOIN follows f ON f.following_id = p.user_id
            JOIN users u ON u.id = p.user_id
            WHERE f.follower_id = $1
            ORDER BY p.created_at DESC
            LIMIT $2
          metricsKey: p99Latency
          lesson: >-
            Pull mode: every GET runs this JOIN. Latency tracks how many accounts you
            follow, not how many posts were pre-written to Redis.
        - component: db
          action: "JOIN posts, follows, and users; return top 20 by created_at."
          detail: "posts × follows × users — indexed on follower_id"
          requires: [db]
          lesson: >-
            Postgres does the heavy work on each read. Under load, connection pool and
            JOIN cost dominate before you add cache or async fan-out.
      explanation: >-
        Pull mode: every feed read hits Postgres with a multi-table JOIN. No Redis
        timeline means no cheap warm read path.
    - id: post-create
      method: POST
      path: "/post"
      label: "Create post"
      trafficPercent: 30
      steps:
        - component: app-server
          action: "Validate user, INSERT post, return 200."
          detail: 'INSERT INTO posts (user_id, content) VALUES ($1, $2) RETURNING id, ...'
          metricsKey: p99Latency
          lesson: >-
            Pull writes only persist the row. Followers see the post on their next feed
            GET when the JOIN runs; there is no queue, worker, or timeline ZADD.
        - component: db
          action: "Stores the new post row."
          requires: [db]
          lesson: >-
            Inserts are cheap compared to fan-out-on-read. Write amplification shows up
            on GET /feed, not on POST /post.
      explanation: >-
        POST /post is a single INSERT and 200 OK. Unlike push, nothing precomputes
        follower timelines; feed reads pay the JOIN cost later.
  narrativeContext:
    db_latency:
      cause: "Every feed read performs a 3-table JOIN as follower counts grow."
      suggestion: "Compare with the push template: add cache + MQ + worker to precompute timelines in Redis."
