id: social-feed-pull
name: "Social Feed (Pull)"
description: >-
  Fan-out on read: feeds are generated on demand by joining posts and follows.
  Simple architecture but reads get expensive as follower counts grow.
  Compare with Push variant to see the tradeoff.
components: 3
bottleneck: "JOIN query latency scaling with follower count"
available: true
premium: false
tags: [read-heavy, beginner]
simulatable: true
deployable: true
# Lower default loadgen rate: most traffic hits expensive fan-out-on-read feed queries at alpha resources.
loadgenDefaultRps: 25
imageKey: social-feed
appDatabaseMode: always
seed:
  dbType: postgres
  dumpPath: social-feed/social-feed.dump
  container: postgres
  podLabel: app=postgres
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: database
    position: [4, 0]
preset:
  nodes:
    - id: lb-1
      type: load_balancer
      position: [-3, 0.3, 0]
      label: Load Balancer
      config:
        algorithm: round-robin
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: Feed Service
      config:
        replicas: 1
        instanceSize: small
    - id: db-1
      type: database
      position: [3, 0.3, 0]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-lb-app
      sourceId: lb-1
      targetId: app-1
      protocol: http
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp

storytelling:
  roles:
    app-server:
      base: "Handles feed reads and post creation"
      variants:
        - when: { topology: "!hasCache" }
          label: "Pull mode: every feed read is a DB JOIN"
    db:
      base: "Stores users, posts, and the follower graph"
    lb:
      base: "Routes requests across app-server replicas"
  journeys:
    - id: feed-read
      method: GET
      path: "/feed/{userId}"
      label: "Feed reads"
      trafficPercent: 100
      steps:
        - component: lb
          action: "Routes to app-server."
          requires: [lb]
        - component: app-server
          action: "Runs fan-out-on-read query per request."
          metricsKey: p99Latency
        - component: db
          action: "JOIN posts × follows × users for the timeline."
          requires: [db]
      explanation: >-
        Pull mode: every feed read hits Postgres with a multi-table JOIN.
  narrativeContext:
    db_latency:
      cause: "Every feed read performs a 3-table JOIN as follower counts grow."
      suggestion: "Compare with the push template: add cache + MQ + worker to precompute timelines in Redis."
