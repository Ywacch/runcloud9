id: ecommerce
name: E-Commerce
description: >-
  Multi-server product catalog with shared database and cache layer.
  Tests load balancer distribution and write contention.
  Add a message queue and worker for async order processing.
components: 5
bottleneck: "Write contention on shared database"
available: true
premium: false
tags: [multi-server, write-heavy, intermediate]
simulatable: true
deployable: true
imageKey: ecommerce
workerImageKey: ecommerce-worker
appDatabaseMode: always
seed:
  dbType: postgres
  dumpPath: ecommerce/ecommerce.dump
  container: postgres
  podLabel: app=postgres
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, -1]
  - type: compute
    position: [2, 1]
  - type: cache
    position: [4, 0]
  - type: database
    position: [6, 0]
preset:
  nodes:
    - id: lb-1
      type: load_balancer
      position: [-4, 0.3, 0]
      label: Load Balancer
      config:
        algorithm: round-robin
    - id: app-1
      type: compute
      position: [-1, 0.3, 0]
      label: App Server
      config:
        replicas: 1
        instanceSize: small
    - id: mq-1
      type: message_queue
      position: [2, 0.3, -1.4]
      label: Message Queue
      config:
        engine: rabbitmq
        durable: true
    - id: worker-1
      type: worker
      position: [5, 0.3, -1.4]
      label: Worker
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [2, 0.3, 1.4]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [5, 0.3, 1.4]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-lb-app
      sourceId: lb-1
      targetId: app-1
      protocol: http
    - id: e-app-mq
      sourceId: app-1
      targetId: mq-1
      protocol: http
    - id: e-worker-mq
      sourceId: worker-1
      targetId: mq-1
      protocol: tcp
    - id: e-worker-db
      sourceId: worker-1
      targetId: db-1
      protocol: tcp
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp

# Products table: id, name, price, stock (see images/ecommerce/db.go).
proxyQueries:
  - pattern: '^catalog$'
    sql: |-
      SELECT json_build_object(
        'products',
        COALESCE(json_agg(row_to_json(t) ORDER BY t.id), '[]'::json)
      )
      FROM (
        SELECT id, name, price::float8 AS price, stock FROM products ORDER BY id
      ) AS t
    params: []
  - pattern: '^product:(.+)$'
    sql: |-
      SELECT row_to_json(s) FROM (
        SELECT id, name, price::float8 AS price, stock FROM products WHERE id = $1::int
      ) AS s
    params:
      - capture: 1
        dbType: integer
  - pattern: '^product-pool$'
    sql: |-
      SELECT json_build_object(
        'productIds',
        COALESCE(json_agg(x.id ORDER BY x.id), '[]'::json)
      )
      FROM (SELECT id FROM products ORDER BY id LIMIT 50) AS x
    params: []

storytelling:
  # Catalog and checkout use direct Redis (cache-aside). Proxy cache strategies are not deployable here (appDatabaseMode: always).
  roles:
    cache:
      base: "App checks Redis for catalog and product keys; misses load from Postgres"
    db:
      base: "Products, inventory, and order rows"
    mq:
      base: "Checkout publishes order.placed for workers"
    worker:
      base: "Consumes orders from the queue and runs fulfillment"
    app-server:
      base: "GET /catalog and POST /checkout"
    lb:
      base: "Routes traffic across app-server replicas"
  journeys:
    - id: catalog
      method: GET
      path: "/catalog"
      label: "Catalog browse"
      trafficPercent: 40
      steps:
        - component: lb
          action: "Routes to app-server."
          requires: [lb]
        - component: app-server
          action: "Serves catalog payload."
          metricsKey: p99Latency
        - component: cache
          action: "Hot product rows when cached."
          requires: [cache]
        - component: db
          action: "Loads catalog on miss."
          requires: [db]
      explanation: >-
        Catalog GET checks Redis first. On miss the app loads from Postgres and SETs the key.
        Checkout always writes inventory and orders to Postgres directly.
    - id: checkout
      method: POST
      path: "/checkout"
      label: "Checkout"
      trafficPercent: 30
      steps:
        - component: lb
          action: "Routes checkout."
          requires: [lb]
        - component: app-server
          action: "Validates cart and inventory."
          metricsKey: p99Latency
        - component: db
          action: "Inventory update and order row."
          requires: [db]
        - component: mq
          action: "Publishes order.placed when present."
          requires: [mq]
        - component: worker
          action: "Async fulfillment when present."
          requires: [mq, worker]
      explanation: "Writes hit Postgres; optional MQ/worker handle async fulfillment."
  narrativeContext:
    db_latency:
      cause: "Checkout and catalog paths contend on shared Postgres under load."
      suggestion: "Add cache or read replicas to spread read load; scale workers if the queue backs up."
