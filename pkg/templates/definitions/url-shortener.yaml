id: url-shortener
name: URL Shortener
description: >-
  Classic read-heavy cache-aside pattern with PostgreSQL + Redis.
  Demonstrates cache hit/miss ratios, DB query amplification on cache miss,
  and strategy tradeoffs.
components: 4
bottleneck: "Cache miss → DB query amplification"
available: true
premium: false
tags: [caching, read-heavy, beginner]
simulatable: true
deployable: true
imageKey: url-shortener
workerImageKey: ""
appDatabaseMode: non-proxy
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: cache
    position: [4, -1]
  - type: database
    position: [4, 1]
preset:
  nodes:
    - id: lb-1
      type: load_balancer
      position: [-3, 0.3, 0]
      label: Load Balancer
      config:
        algorithm: round-robin
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: App Server
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [3, 0.3, -1.2]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [3, 0.3, 1.2]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-lb-app
      sourceId: lb-1
      targetId: app-1
      protocol: http
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
seed:
  dbType: postgres
  dumpPath: url-shortener/urls.dump
  container: postgres
  podLabel: app=postgres

# Caching-proxy read-through: value returned to app is the original URL string only.
proxyQueries:
  - pattern: '^([^:]+)$'
    sql: SELECT original FROM urls WHERE code = $1
    params:
      - capture: 1
        dbType: text

storytelling:
  roles:
    cache:
      base: "Redis holds short code to URL mappings"
      variants:
        - when: { strategy: "write-through" }
          label: "SET hits Redis first; the caching proxy writes the row to Postgres before the write completes"
        - when: { strategy: "write-behind" }
          label: "SET lands in Redis; the proxy flushes the row to Postgres later"
        - when: { strategy: "read-through" }
          label: "On miss the proxy runs SQL, fills Redis, and returns the URL"
        - when: { strategy: "cache-aside" }
          label: "App checks Redis; on miss it reads Postgres and SETs the key"
    db:
      base: "Postgres table mapping codes to original URLs"
    app-server:
      base: "Handles POST /shorten and GET /r/{code}"
    lb:
      base: "Routes traffic across app-server replicas"
  journeys:
    - id: resolve
      method: GET
      path: "/r/{code}"
      label: "Resolve short URL"
      trafficPercent: 80
      steps:
        - component: lb
          action: "Routes GET /r/{code} to app-server."
          requires: [lb]
        - component: app-server
          action: "Looks up the short code."
          metricsKey: p99Latency
        - component: cache
          action: "GET short:{code} — hot path for popular links."
          metricsKey: redisAvgLatency
          requires: [cache]
        - component: db
          action: "SELECT original URL by code when cache misses."
          detail: "SELECT url FROM urls WHERE code = ?"
          requires: [db]
          condition: "On miss"
          excludeWhen: { strategy: "read-through" }
        - component: db
          action: "On miss, the caching proxy runs configured SQL, repopulates short:{code}, then returns the URL to the app."
          detail: "Proxy-driven SELECT + backfill"
          requires: [db]
          condition: "On miss"
          onlyWhen: { strategy: "read-through" }
      explanation: >-
        Classic cache-aside: try Redis for the mapping, fall back to Postgres on miss.
      explanationVariants:
        - when: { strategy: "write-through" }
          text: >-
            Write-through: Redis stays warm for recently shortened codes because every write lands in the cache layer before durable storage; resolves rarely miss for fresh keys.
        - when: { strategy: "write-behind" }
          text: >-
            Write-behind: new codes appear in Redis immediately while Postgres persistence trails; hot keys stay warm so resolves are fast once the async flush completes.
        - when: { strategy: "read-through" }
          text: >-
            Read-through: the app still checks Redis first; on miss the caching proxy loads from Postgres, fills short:{code}, and serves the mapping without the app hand-rolling a second hop.
    - id: shorten
      method: POST
      path: "/shorten"
      label: "Create short URL"
      trafficPercent: 20
      steps:
        - component: lb
          action: "Routes POST /shorten."
          requires: [lb]
        - component: app-server
          action: "Allocates a code, persists the mapping, returns short URL."
          metricsKey: p99Latency
        # cache-aside (default): durable row first, then warm Redis.
        - component: db
          action: "INSERT mapping (code → original URL)."
          requires: [db]
          onlyWhen: { strategy: "cache-aside" }
        - component: cache
          action: "SET short:{code} after durable insert."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "cache-aside" }
        # read-through writes: same order as cache-aside (DB first → cache).
        - component: db
          action: "INSERT mapping (code → original URL)."
          requires: [db]
          onlyWhen: { strategy: "read-through" }
        - component: cache
          action: "SET short:{code} after durable insert (same write shape as cache-aside)."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "read-through" }
        # write-through: cache first; proxy persists to Postgres synchronously.
        - component: cache
          action: "SET short:{code} — caching proxy persists to Postgres before completing the write."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "write-through" }
        - component: db
          action: "Row written via caching-proxy after Redis accept."
          requires: [db]
          onlyWhen: { strategy: "write-through" }
        # write-behind: cache first; Postgres updated asynchronously by proxy.
        - component: cache
          action: "SET short:{code} — proxy acknowledges immediately; durable INSERT is asynchronous."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "write-behind" }
        - component: db
          action: "INSERT applied asynchronously by the caching-proxy after the hot write path."
          requires: [db]
          onlyWhen: { strategy: "write-behind" }
      explanation: >-
        Cache-aside write path: insert into Postgres first, then SET Redis so GET /r/{code} stays fast.
      explanationVariants:
        - when: { strategy: "write-through" }
          text: >-
            Write-through: the app writes to Redis first; the caching-proxy persists to Postgres synchronously before the write completes.
        - when: { strategy: "write-behind" }
          text: >-
            Write-behind: Redis accepts SET immediately for low latency; the proxy flushes the row to Postgres in the background (brief window where Redis is ahead of durable storage).
        - when: { strategy: "read-through" }
          text: >-
            Read-through resolves use the proxy on reads, but writes for this template still follow DB-first then SET so the mapping is durable before it is advertised in Redis.
  narrativeContext:
    db_latency:
      cause: "URL lookups hit Postgres directly on cache miss."
      suggestion: "Add a cache node to serve hot lookups from Redis."
    cache_hit_low:
      cause: "More lookups are missing Redis and falling through to Postgres."
