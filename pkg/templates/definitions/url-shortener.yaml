id: url-shortener
name: URL Shortener
description: >-
  Classic read-heavy cache-aside pattern with PostgreSQL + Redis.
  Demonstrates cache hit/miss ratios, DB query amplification on cache miss,
  and strategy tradeoffs.
components: 4
bottleneck: "Cache miss → DB query amplification"
available: true
premium: false
tags: [caching, read-heavy, beginner]
simulatable: true
deployable: true
imageKey: url-shortener
workerImageKey: ""
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: cache
    position: [4, -1]
  - type: database
    position: [4, 1]
preset:
  nodes:
    - id: lb-1
      type: load_balancer
      position: [-3, 0.3, 0]
      label: Load Balancer
      config:
        algorithm: round-robin
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: App Server
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [3, 0.3, -1.2]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [3, 0.3, 1.2]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-lb-app
      sourceId: lb-1
      targetId: app-1
      protocol: http
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
seed:
  dbType: postgres
  dumpPath: url-shortener/urls.dump
  container: postgres
  podLabel: app=postgres
