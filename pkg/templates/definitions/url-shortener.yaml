id: url-shortener
name: URL Shortener
description: >-
  Classic read-heavy cache-aside pattern with PostgreSQL + Redis.
  Demonstrates cache hit/miss ratios, DB query amplification on cache miss,
  and strategy tradeoffs.
components: 3
bottleneck: "Cache miss → DB query amplification"
descriptionLite: >-
  Classic read-heavy cache-aside with PostgreSQL + Redis on a single app server.
  Demonstrates cache hit/miss ratios, DB query amplification on cache miss,
  and strategy tradeoffs.
componentsLite: 3
bottleneckLite: "Cache miss → DB query amplification"
available: true
premium: false
tags: [caching, read-heavy, beginner]
simulatable: true
deployable: true
imageKey: url-shortener
workerImageKey: ""
appDatabaseMode: non-proxy
prometheusMetrics:
  queries:
    - key: shortener.collisions
      expr: sum(shortener_code_collisions_total{<<ns>>})
topology:
  - type: load_balancer
    position: [0, 0]
  - type: compute
    position: [2, 0]
  - type: cache
    position: [4, -1]
  - type: database
    position: [4, 1]
preset:
  nodes:
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: App Server
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [3, 0.3, -1.2]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [3, 0.3, 1.2]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
presetLite:
  nodes:
    - id: app-1
      type: compute
      position: [0, 0.3, 0]
      label: App Server
      config:
        replicas: 1
        instanceSize: small
    - id: cache-1
      type: cache
      position: [3, 0.3, -1.2]
      label: Redis
      config:
        strategy: cache-aside
        evictionPolicy: allkeys-lru
    - id: db-1
      type: database
      position: [3, 0.3, 1.2]
      label: PostgreSQL
      config:
        engine: postgresql
        storageGB: 10
        maxConnections: 100
  edges:
    - id: e-app-cache
      sourceId: app-1
      targetId: cache-1
      protocol: tcp
    - id: e-app-db
      sourceId: app-1
      targetId: db-1
      protocol: tcp
seed:
  dbType: postgres
  dumpPath: url-shortener/urls.dump
  container: postgres
  podLabel: app=postgres

# Proxy GET miss-fill (always-on for write-through / write-behind): value is the original URL string only.
proxyQueries:
  - pattern: '^([^:]+)$'
    sql: SELECT original FROM urls WHERE code = $1
    params:
      - capture: 1
        dbType: text

introspection:
  db:
    engine: postgres
    tables: [urls]
  cache:
    engine: redis
    keyPatterns: ["*"]

storytelling:
  roles:
    cache:
      base: "Redis holds short code to URL mappings"
      variants:
        - when: { strategy: "write-through" }
          label: >-
            SET hits Redis first; the caching proxy writes Postgres before ack.
            On miss, the proxy loads from Postgres and refills Redis (read-through is always on).
        - when: { strategy: "write-behind" }
          label: >-
            SET lands in Redis; the proxy flushes Postgres later.
            On miss, the proxy loads from Postgres and refills Redis (read-through is always on).
        - when: { strategy: "cache-aside" }
          label: "App checks Redis; on miss it reads Postgres and SETs the key"
    db:
      base: "Postgres table mapping codes to original URLs"
    app-server:
      base: "Handles POST /shorten and GET /r/{code}"
    lb:
      base: "Routes traffic across app-server replicas"
  journeys:
    - id: resolve
      method: GET
      path: "/r/{code}"
      label: "Resolve short URL"
      trafficPercent: 80
      steps:
        - component: lb
          action: "Routes GET /r/{code} to app-server."
          requires: [lb]
        - component: app-server
          action: "Looks up the short code."
          metricsKey: p99Latency
        - component: cache
          action: "GET short:{code} ; hot path for popular links."
          metricsKey: redisAvgLatency
          requires: [cache]
          lesson: >-
            Most traffic should stop here. A hit avoids Postgres on the read path.
        - component: db
          action: "SELECT original URL by code when cache misses."
          detail: "SELECT url FROM urls WHERE code = ?"
          requires: [db]
          condition: "On miss"
          onlyWhen: { strategy: "cache-aside" }
          lesson: >-
            Cache-aside miss: the app loads the row and can warm Redis for the next GET.
        - component: db
          action: "On miss, the caching proxy runs configured SQL, repopulates the key, then returns the URL to the app."
          detail: "Proxy-driven SELECT + backfill (read-through, always on in proxy mode)"
          requires: [db]
          condition: "On miss"
          excludeWhen: { strategy: "cache-aside" }
          lesson: >-
            Proxy miss-fill: your app never talks to Postgres on reads. The caching proxy owns the load.
      explanation: >-
        Classic cache-aside: try Redis for the mapping, fall back to Postgres on miss.
      explanationVariants:
        - when: { strategy: "write-through" }
          text: >-
            Write-through: every write lands in Redis then Postgres before ack, so fresh codes stay warm.
            On miss, the proxy still loads from Postgres and refills Redis (read-through is always on).
        - when: { strategy: "write-behind" }
          text: >-
            Write-behind: new codes appear in Redis immediately while Postgres persistence trails.
            On miss, the proxy loads from Postgres and refills Redis (read-through is always on).
    - id: shorten
      method: POST
      path: "/shorten"
      label: "Create short URL"
      trafficPercent: 20
      steps:
        - component: lb
          action: "Routes POST /shorten."
          requires: [lb]
        - component: app-server
          action: "Allocates a code, persists the mapping, returns short URL."
          metricsKey: p99Latency
        # cache-aside: durable row first; Redis warms on next GET (immutable codes).
        - component: db
          action: "INSERT mapping (code → original URL)."
          requires: [db]
          onlyWhen: { strategy: "cache-aside" }
        - component: cache
          action: "No Redis write on create; the next GET /r/{code} miss warms the cache."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "cache-aside" }
          lesson: >-
            Cache-aside here does not SET on write; codes are immutable, so the first resolve populates Redis.
        # write-through: cache first; proxy persists to Postgres synchronously.
        - component: cache
          action: "SET short:{code}; caching proxy persists to Postgres before completing the write."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "write-through" }
          lesson: >-
            Write-through: Redis accepts first; the proxy persists to Postgres before the
            write completes so later GETs stay warm. On DB failure the proxy deletes the cache key.
        - component: db
          action: "Row written via caching-proxy after Redis accept."
          requires: [db]
          onlyWhen: { strategy: "write-through" }
        # write-behind: cache first; Postgres updated asynchronously by proxy.
        - component: cache
          action: "SET short:{code}; proxy acknowledges immediately; durable INSERT is asynchronous."
          metricsKey: redisAvgLatency
          requires: [cache]
          onlyWhen: { strategy: "write-behind" }
        - component: db
          action: "INSERT applied asynchronously by the caching-proxy after the hot write path."
          requires: [db]
          onlyWhen: { strategy: "write-behind" }
      explanation: >-
        Cache-aside write path: insert into Postgres; Redis is populated on the first successful resolve.
      explanationVariants:
        - when: { strategy: "write-through" }
          text: >-
            Write-through: the app writes to the proxy; Redis is set first and Postgres is persisted
            synchronously before the write completes (with cache rollback if the DB write fails).
        - when: { strategy: "write-behind" }
          text: >-
            Write-behind: Redis accepts SET immediately for low latency; the proxy flushes the row to Postgres in the background (brief window where Redis is ahead of durable storage).
  narrativeContext:
    db_latency:
      cause: "URL lookups hit Postgres directly on cache miss."
      suggestion: "Add a cache node to serve hot lookups from Redis."
    cache_hit_low:
      cause: "More lookups are missing Redis and falling through to Postgres."
